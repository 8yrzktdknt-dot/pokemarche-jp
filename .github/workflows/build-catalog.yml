# Construit l'index visuel des cartes (catalog/pokemon-<langue>.json) utilisé par le scanner.
# Lancement : automatiquement chaque semaine et quand le script change,
# ou à la main depuis l'onglet Actions → « Catalogue de cartes » → Run workflow.
name: Catalogue de cartes

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Langue des cartes (ja, en, fr…)"
        default: ja
        required: true
      sets:
        description: "Extensions à traiter, séparées par des virgules (vide = toutes)"
        default: ""
        required: false
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - tools/catalog/**
      - mobile/src/lib/scan/visualIndex.ts

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/catalog/package-lock.json

      - name: Cache du modèle IA
        uses: actions/cache@v4
        with:
          path: tools/catalog/node_modules/@xenova/transformers/.cache
          key: clip-vit-base-patch32-v1

      - name: Installer
        working-directory: tools/catalog
        run: npm ci --no-audit --no-fund

      - name: Construire l'index
        working-directory: tools/catalog
        env:
          CARD_LANG: ${{ github.event.inputs.lang || 'ja' }}
          SETS: ${{ github.event.inputs.sets || '' }}
        run: npm run build

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Catalogue : mise à jour de l'index visuel des cartes"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
